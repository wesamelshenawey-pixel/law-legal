services:
  web:
    # Runs the cloned source with `npm run dev` (tsx server.ts): Express + Vite
    # in middleware mode, serving the app and its /api routes on port 3000.
    image: node:22-bookworm-slim
    working_dir: /app
    # Startup script validates env vars before the app runs.
    user: root
    labels:
      base44.project: "Wesam Legal App"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - DISABLE_HMR=false
      # Passed through for sandbox dev servers (see .base44/environment.json).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      # Keep file watching reliable across the bind mount.
      - CHOKIDAR_USEPOLLING=true
    env_file:
      # Boot-only placeholders first; platform-delivered secrets come last so
      # real values win. The secrets file is optional: the server boots without
      # it and AI routes report the missing key.
      - ./.env.base44-defaults
      - path: /run/base44/app.env
        required: false
    command:
      - /app/docker/startup.sh
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec npm run dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: on-failure

volumes:
  node_modules:
