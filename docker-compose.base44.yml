services:
  app:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports: ["3000:3000"]
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://localhost:3000/ >/dev/null || (echo app failed; exit 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 120s
volumes:
  node_modules:
