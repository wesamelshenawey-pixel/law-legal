services:
  web:
    # Runs the cloned source with `npm run dev` (tsx server.ts): Express + Vite
    # in middleware mode, serving the app and its /api routes on port 3000.
    image: node:22-bookworm
    working_dir: /app
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DISABLE_HMR=false
      # Passed through for sandbox dev servers (see .base44/environment.json).
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      # Platform-delivered secrets (GEMINI_API_KEY). Optional: the server boots
      # without it and AI routes report the missing key.
      - path: /run/base44/app.env
        required: false
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: web
      base44.kind: web
      base44.port: "3000"

volumes:
  node_modules:
